name: Telegram → X mirror

on:
  schedule:
    - cron: "*/5 * * * *"  # 다음 실행을 항상 대기열에 올려 두기 위한 것 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트 모드 (X에 올리지 않고 로그로만 확인)"
        type: boolean
        default: true

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_MAX_WEIGHT: ${{ vars.X_MAX_WEIGHT || '25000' }}  # Premium 계정 기준. 일반 계정이면 Variables에 280
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          RUN_SECS: "3300"  # 한 번 실행되면 55분간 대기하며 바로 반응. 끝나면 대기 중인 다음 실행이 이어받음
