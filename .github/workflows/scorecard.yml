name: Daily scorecard

on:
  schedule:
    - cron: "30 13 * * *"  # 한국 시간 오후 10시 30분 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:
    inputs:
      debug:
        description: "캡처 점검용 파일(전체 화면, 카드 글자)을 debug-scorecard 브랜치에 올리기"
        type: boolean
        default: false

concurrency:
  group: scorecard
  cancel-in-progress: false

permissions:
  contents: write
  actions: read  # 중복 실행 확인용  # 점검용 브랜치에 올릴 때만 쓴다

jobs:
  # 봇이 이미 시간 맞춰 실행시켰으면, 늦게 도착한 GitHub 예약 실행은 건너뛴다 (중복 초안 방지)
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(date -u -d '-90 min' +%FT%TZ)
            n=$(gh run list -R "${{ github.repository }}" -w "${{ github.workflow_ref }}" --created ">=$since" \
                --json databaseId --jq '[.[] | select(.databaseId != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  scorecard:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.48.0
      - run: python -m playwright install --with-deps chromium
      - run: python scorecard.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          SCORECARD_DEBUG_DIR: ${{ inputs.debug && 'debug' || '' }}
      - name: Upload debug files to debug-scorecard branch
        if: ${{ always() && inputs.debug }}
        run: |
          mkdir -p debug && cp -f scorecard.png debug/ 2>/dev/null || true
          git config user.name "scorecard-bot"
          git config user.email "scorecard-bot@users.noreply.github.com"
          git checkout --orphan debug-scorecard
          git rm -rq --cached .
          git add -f debug
          git commit -qm "scorecard debug $(date -u +%FT%TZ)"
          git push -f origin debug-scorecard
